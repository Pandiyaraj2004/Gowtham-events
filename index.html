<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gowtham Events — Premium Event Design & Coordination</title>
    <meta name="description" content="Gowtham Events is a premier luxury event management and design agency specializing in bespoke weddings, corporate galas, and immersive experiential productions." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gowtham Events — Premium Event Design & Coordination" />
    <meta property="og:description" content="World-class event curation, luxury weddings, and high-impact experiential productions." />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gowtham Events — Premium Event Design & Coordination" />
    <meta name="twitter:description" content="World-class event curation, luxury weddings, and high-impact experiential productions." />

    <!-- Theme Hydration (Prevents Flash of Wrong Theme) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme') || 'dark';
          document.documentElement.setAttribute('data-theme', saved);
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(saved);
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-amber-500/30 selection:text-amber-200 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
